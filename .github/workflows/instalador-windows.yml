name: Instalador de Windows

on:
  push:
    branches: [main]
    paths:
      - 'escritorio/**'
      - '.github/workflows/instalador-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r escritorio/requisitos.txt pyinstaller==6.11.1

      - name: Probar los calculos
        run: python escritorio/probar_nucleo.py

      - name: Comprobar que la ventana se puede construir en Windows
        run: python escritorio/probar_ventana.py

      - name: Construir el .exe
        run: pyinstaller --noconfirm --clean escritorio/empaquetado/ControlDeHoras.spec

      - name: Llenar con datos de ejemplo para las capturas
        run: python escritorio/empaquetado/sembrar_demo.py

      - name: Abrir la app y fotografiar cada pestana
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force -Path capturas | Out-Null

          $p = Start-Process -FilePath "dist\ControlDeHoras.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "La aplicacion se cerro sola (codigo $($p.ExitCode))."
            exit 1
          }
          Write-Host "La app siguio abierta 15 segundos: arranca bien."

          function Fotografiar($nombre) {
            $a = [System.Windows.Forms.SystemInformation]::VirtualScreen.Width
            $h = [System.Windows.Forms.SystemInformation]::VirtualScreen.Height
            $bmp = New-Object System.Drawing.Bitmap $a, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen(0, 0, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\capturas\$nombre.png",
                      [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }

          [System.Windows.Forms.SendKeys]::SendWait("^{TAB}") 2>$null
          Fotografiar "1-jornadas"
          foreach ($n in @("2-resumen", "3-trabajadores", "4-configuracion")) {
            [System.Windows.Forms.SendKeys]::SendWait("^{TAB}")
            Start-Sleep -Seconds 2
            Fotografiar $n
          }
          Stop-Process -Id $p.Id -Force

      - name: Preparar el LEEME
        shell: pwsh
        run: Copy-Item escritorio/LEEME.txt LEEME.txt

      - name: Asegurar Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Construir el instalador
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc escritorio\empaquetado\instalador.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Comprobar que el instalador quedo armado
        shell: pwsh
        run: |
          $i = Get-Item "salida\ControlDeHoras-Setup.exe"
          $e = Get-Item "dist\ControlDeHoras.exe"
          Write-Host ("exe:        {0:N1} MB" -f ($e.Length / 1MB))
          Write-Host ("instalador: {0:N1} MB" -f ($i.Length / 1MB))
          if ($i.Length -lt 3MB) { Write-Error "El instalador quedo muy chico."; exit 1 }

      - name: Instalar de verdad, abrir la app instalada y desinstalar
        shell: pwsh
        run: |
          $destino = "C:\PruebaControlDeHoras"
          Write-Host "== Instalando en silencio =="
          $i = Start-Process -FilePath "salida\ControlDeHoras-Setup.exe" `
               -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART", `
                             "/DIR=$destino","/TASKS=" -Wait -PassThru
          if ($i.ExitCode -ne 0) {
            Write-Error "El instalador termino con codigo $($i.ExitCode)."; exit 1
          }

          $exe = Join-Path $destino "ControlDeHoras.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "No quedo instalado $exe"; exit 1
          }
          if (-not (Test-Path (Join-Path $destino "LEEME.txt"))) {
            Write-Error "Falta el LEEME junto a la aplicacion"; exit 1
          }
          $desinst = Get-ChildItem $destino -Filter "unins*.exe" | Select-Object -First 1
          if (-not $desinst) { Write-Error "No quedo desinstalador"; exit 1 }
          Write-Host "Instalado correctamente en $destino"

          Write-Host "== Abriendo la aplicacion instalada =="
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "La app instalada se cerro sola (codigo $($p.ExitCode))."
            exit 1
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $a = [System.Windows.Forms.SystemInformation]::VirtualScreen.Width
          $h = [System.Windows.Forms.SystemInformation]::VirtualScreen.Height
          $bmp = New-Object System.Drawing.Bitmap $a, $h
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen(0,0,0,0,$bmp.Size)
          $bmp.Save("$PWD\capturas\5-instalada.png",
                    [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "La app instalada siguio abierta 15 segundos."
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2

          Write-Host "== Desinstalando =="
          Start-Process -FilePath $desinst.FullName `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait | Out-Null
          # El desinstalador de Inno Setup se copia a la carpeta temporal y
          # sigue trabajando en segundo plano, asi que -Wait vuelve antes de
          # tiempo. Hay que esperar a que el ejecutable desaparezca.
          $limite = (Get-Date).AddSeconds(90)
          while ((Test-Path $exe) -and (Get-Date) -lt $limite) {
            Start-Sleep -Seconds 3
          }
          if (Test-Path $exe) {
            Write-Error "Tras 90 segundos la desinstalacion dejo $exe en su lugar."
            exit 1
          }
          Write-Host "Desinstalado limpio."

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: ControlDeHoras-Setup
          path: salida/ControlDeHoras-Setup.exe

      - name: Guardar las capturas
        uses: actions/upload-artifact@v4
        with:
          name: capturas-ventana
          path: capturas/

      - name: Publicar la version descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Control de Horas 1.0.0
          body: |
            Aplicacion de escritorio para Windows: control de horas trabajadas
            de Carniceria El Buen Corte, Loncoche.

            **Descarga `ControlDeHoras-Setup.exe` y dale doble clic.**

            No necesita internet, ni servidor, ni instalar Python.
            Los datos quedan en tu carpeta de usuario, asi que se puede
            actualizar la aplicacion sin perder las jornadas registradas.

            Genera el informe mensual en Excel y en PDF, con los turnos
            trabajados, las horas de colacion, las horas extra y lo pagado.
          files: salida/ControlDeHoras-Setup.exe
          fail_on_unmatched_files: true
