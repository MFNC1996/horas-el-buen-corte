name: Instalador de Windows

on:
  push:
    branches: [main]
    paths:
      - 'escritorio/**'
      - '.github/workflows/instalador-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r escritorio/requisitos.txt pyinstaller==6.11.1

      - name: Probar los calculos
        run: |
          python escritorio/probar_nucleo.py
          python escritorio/probar_marcas.py
          python escritorio/probar_pagos.py
          python escritorio/probar_correo.py

      - name: Comprobar que la ventana se puede construir en Windows
        timeout-minutes: 5
        run: python escritorio/probar_ventana.py

      - name: Construir el .exe
        run: pyinstaller --noconfirm --clean escritorio/empaquetado/ControlDeHoras.spec

      - name: Llenar con datos de ejemplo para las capturas
        run: python escritorio/empaquetado/sembrar_demo.py

      - name: Abrir la app y fotografiar cada pestana
        shell: pwsh
        run: escritorio/empaquetado/capturar.ps1

      - name: El programa empaquetado puede exportar a Excel y PDF
        shell: pwsh
        run: |
          # Desde el codigo fuente todo anda, pero dentro del .exe pueden faltar
          # librerias. Asi se descubrio que el PDF fallaba sin Pillow.
          $carpeta = "$PWD\prueba-informes"
          $p = Start-Process -FilePath "dist\ControlDeHoras.exe" `
               -ArgumentList "--probar-informes", "`"$carpeta`"" -Wait -PassThru
          if (Test-Path "$carpeta\error.txt") { Get-Content "$carpeta\error.txt" }
          if ($p.ExitCode -ne 0) {
            Write-Error "El programa empaquetado no pudo generar los informes."; exit 1
          }
          Get-ChildItem $carpeta | ForEach-Object {
            Write-Host ("  {0}: {1:N0} bytes" -f $_.Name, $_.Length)
          }
          Write-Host "Bien: el .exe genera el Excel y el PDF."

      - name: Abrir el programa dos veces no abre dos ventanas
        shell: pwsh
        run: |
          function Contar { @(Get-Process -Name ControlDeHoras -ErrorAction SilentlyContinue).Count }

          $primero = Start-Process -FilePath "dist\ControlDeHoras.exe" -PassThru
          Start-Sleep -Seconds 15
          $antes = Contar
          Write-Host "Con una ventana abierta hay $antes procesos (lanzador + programa)."

          $segundo = Start-Process -FilePath "dist\ControlDeHoras.exe" -PassThru
          Start-Sleep -Seconds 15
          $despues = Contar
          Write-Host "Despues del segundo doble clic hay $despues procesos."

          if (-not $segundo.HasExited) {
            Write-Error "El segundo intento sigue abierto: se abrio otra ventana."; exit 1
          }
          if ($despues -ne $antes) {
            Write-Error "Se abrio una segunda instancia ($antes -> $despues procesos)."; exit 1
          }
          Write-Host "Bien: el segundo doble clic no abrio otra ventana."

          # Cerrando el programa, se tiene que poder abrir de nuevo: el
          # candado no queda trabado aunque se cierre a la fuerza.
          Get-Process -Name ControlDeHoras -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 4
          $otra_vez = Start-Process -FilePath "dist\ControlDeHoras.exe" -PassThru
          Start-Sleep -Seconds 15
          if ((Contar) -eq 0) {
            Write-Error "Despues de cerrarlo a la fuerza no se pudo volver a abrir."; exit 1
          }
          Write-Host "Bien: cerrado a la fuerza, se puede volver a abrir."
          Get-Process -Name ControlDeHoras -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3

      - name: Preparar el LEEME
        shell: pwsh
        run: Copy-Item escritorio/LEEME.txt LEEME.txt

      - name: Asegurar Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Construir el instalador
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc escritorio\empaquetado\instalador.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Comprobar que el instalador quedo armado
        shell: pwsh
        run: |
          $i = Get-Item "salida\ControlDeHoras-Setup.exe"
          $e = Get-Item "dist\ControlDeHoras.exe"
          Write-Host ("exe:        {0:N1} MB" -f ($e.Length / 1MB))
          Write-Host ("instalador: {0:N1} MB" -f ($i.Length / 1MB))
          if ($i.Length -lt 3MB) { Write-Error "El instalador quedo muy chico."; exit 1 }

      - name: Instalar de verdad, abrir la app instalada y desinstalar
        shell: pwsh
        run: |
          $destino = "C:\PruebaControlDeHoras"
          Write-Host "== Instalando en silencio =="
          $i = Start-Process -FilePath "salida\ControlDeHoras-Setup.exe" `
               -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART", `
                             "/DIR=$destino","/TASKS=" -Wait -PassThru
          if ($i.ExitCode -ne 0) {
            Write-Error "El instalador termino con codigo $($i.ExitCode)."; exit 1
          }

          $exe = Join-Path $destino "ControlDeHoras.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "No quedo instalado $exe"; exit 1
          }
          if (-not (Test-Path (Join-Path $destino "LEEME.txt"))) {
            Write-Error "Falta el LEEME junto a la aplicacion"; exit 1
          }
          $desinst = Get-ChildItem $destino -Filter "unins*.exe" | Select-Object -First 1
          if (-not $desinst) { Write-Error "No quedo desinstalador"; exit 1 }
          Write-Host "Instalado correctamente en $destino"

          Write-Host "== Abriendo la aplicacion instalada =="
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Error "La app instalada se cerro sola (codigo $($p.ExitCode))."
            exit 1
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $a = [System.Windows.Forms.SystemInformation]::VirtualScreen.Width
          $h = [System.Windows.Forms.SystemInformation]::VirtualScreen.Height
          $bmp = New-Object System.Drawing.Bitmap $a, $h
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen(0,0,0,0,$bmp.Size)
          $bmp.Save("$PWD\capturas\5-instalada.png",
                    [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "La app instalada siguio abierta 15 segundos."
          # Un ejecutable de PyInstaller en un solo archivo corre como dos
          # procesos: el lanzador y la aplicacion. Matar solo el lanzador deja
          # al hijo vivo reteniendo el .exe, y despues no se puede desinstalar.
          Get-Process -Name ControlDeHoras -ErrorAction SilentlyContinue |
            Stop-Process -Force
          Start-Sleep -Seconds 5
          $vivos = @(Get-Process -Name ControlDeHoras -ErrorAction SilentlyContinue)
          if ($vivos.Count -gt 0) {
            Write-Error "Quedaron $($vivos.Count) procesos vivos."; exit 1
          }

          Write-Host "== Desinstalando =="
          $reg = "$PWD\desinstalacion.log"
          Write-Host "Desinstalador: $($desinst.FullName)"
          Start-Process -FilePath $desinst.FullName `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$reg" `
            -Wait | Out-Null
          # El desinstalador de Inno Setup se copia a la carpeta temporal y
          # sigue trabajando en segundo plano, asi que -Wait vuelve antes de
          # tiempo. Hay que esperar a que el ejecutable desaparezca.
          $limite = (Get-Date).AddSeconds(90)
          while ((Test-Path $exe) -and (Get-Date) -lt $limite) {
            Start-Sleep -Seconds 3
          }
          if (Test-Path $exe) {
            Write-Host "== Que quedo en la carpeta =="
            Get-ChildItem $destino -Recurse | Select-Object FullName | Format-Table -Auto
            if (Test-Path $reg) {
              Write-Host "== Registro del desinstalador =="
              Get-Content $reg | Select-Object -Last 40
            } else {
              Write-Host "El desinstalador no dejo registro en $reg"
            }
            Write-Error "Tras 90 segundos la desinstalacion dejo $exe en su lugar."
            exit 1
          }
          Write-Host "Desinstalado limpio."

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: ControlDeHoras-Setup
          path: salida/ControlDeHoras-Setup.exe

      - name: Guardar la version portable
        uses: actions/upload-artifact@v4
        with:
          name: ControlDeHoras-portable
          path: dist/ControlDeHoras.exe

      - name: Guardar las capturas
        uses: actions/upload-artifact@v4
        with:
          name: capturas-ventana
          path: capturas/

      - name: Publicar la version descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: Control de Horas 1.7.0
          body: |
            Aplicacion de escritorio para Windows: control de horas trabajadas
            de Carniceria El Buen Corte, Loncoche.

            ### Novedad de esta version: marcacion de asistencia

            El trabajador toca su nombre y presiona MARCAR. La aplicacion sola
            sabe cual de las cuatro marcas del dia le toca:

            entrada -> inicio colacion -> fin colacion -> salida

            La hora la pone el reloj del computador. Cada trabajador lleva su
            propia cuenta, asi que si se alternan no se mezclan nunca, y apenas
            alguien marca se suelta la seleccion para que el siguiente no marque
            por error a nombre del anterior.

            ### Valor del dia y acumulado para el pago

            Cada dia muestra cuanto vale: horas normales por el valor hora, mas
            las horas extra por el valor de la hora extra. Todo lo que se pasa
            de la jornada del contrato EN EL DIA es hora extra.

            Ejemplo: entra 08:30, colacion de 13:30 a 14:30, sale 19:30. Son 10
            horas = 7 normales + 3 extra. Con la hora a $3.075 y la extra a
            $3.900, ese dia vale $33.225.

            La semana acumula esos valores y cierra el dia de pago que elijas
            (por defecto el sabado), asi que el total que muestra es justo lo que
            hay que pagar. Sin calculadora.

            ### Novedad de la 1.7.0: aviso por correo al trabajador

            Cada vez que alguien marca, le llega un correo con lo que marco, a
            que hora, y como va su dia. Se enciende en Configuracion, con la
            cuenta que envia (Gmail viene puesto de fabrica) y una CONTRASENA DE
            APLICACION de esa cuenta, no la contrasena normal. El correo de cada
            trabajador se escribe en la pestana Trabajadores.

            Si no hay internet, la marca se registra igual: el aviso queda
            esperando y sale solo cuando vuelve la conexion. En Configuracion se
            ve cuantos salieron, cuantos esperan y cual fue el ultimo problema.

            ### Novedades de la 1.6.0

            - La tabla muestra por separado cuanto es en horas normales y cuanto en
              horas extra, ademas del total del dia. El check de pagado sigue siendo
              uno por dia.
            - Por persona se ve cuanto se le pago y cuanto se le debe en cada parte.

            ### Novedades de la 1.5.x

            - Pantalla de carga al abrir: el logo al centro, "Carniceria El Buen
              Corte" y una barra con lo que va cargando. Despues se abre la app.
            - Arreglado: en el programa instalado, Exportar a PDF fallaba.

            - El logo del local en todo el sistema: en la cabecera de la ventana,
              como icono del programa (escritorio y barra de tareas), en el
              instalador y en la cabecera del informe PDF.

            ### Novedades de la 1.4.x

            - "by Macoem" a la vista, en la cabecera y en la barra de titulo.
            - Una sola ventana a la vez: si el programa ya esta abierto, un segundo
              doble clic trae al frente el que ya estaba en vez de abrir otro.
            - Eliminar un dia registrado por error, desde Dias trabajados: se elige
              la fila y se presiona "Eliminar dia" (o la tecla Supr). Pregunta
              antes, y no deja borrar un dia ya pagado.

            - Las horas se ven como reloj: 10:42, no "10,70" (que se leia como
              diez horas con setenta).
            - Nueva pestana **Dias trabajados**: por cada dia, a quien, cuantas
              horas, cuantas normales, cuantas extra y cuanto pagar. Nada mas.
            - **Check de pagado** en cada dia. Un dia pagado queda con su monto
              fijo y no se puede corregir sin quitarle el check antes.
            - Nueva pestana **Pagos por persona**: dias trabajados, cuantos se le
              pagaron, cuanto se le ha pagado y cuanto se le debe, con el detalle
              de cada dia para quien cobra a fin de mes. Un boton paga todo lo
              pendiente de una vez.
            - Fuera lo que sobraba: las columnas de marcas y de desglose en
              pesos, y la semana con dia de pago.

            ---

            Desarrollado por Macoem.

            **Descarga `ControlDeHoras-Setup.exe` y dale doble clic.**

            No necesita internet, ni servidor, ni instalar Python.
            Los datos quedan en tu carpeta de usuario, asi que se puede
            actualizar la aplicacion sin perder las jornadas registradas.

            Genera el informe mensual en Excel y en PDF, con los turnos
            trabajados, las horas de colacion, las horas extra y lo pagado.

            ---

            **`ControlDeHoras-Setup.exe`** es el instalador: deja acceso
            directo en el Escritorio y se puede desinstalar desde Windows.
            Es el que conviene usar.

            **`ControlDeHoras.exe`** es la version portable: corre tal cual,
            sin instalar, tambien desde un pendrive. Util para probarla o
            para un computador donde no se pueda instalar nada.

            Las dos guardan los datos en el mismo lugar, asi que se pueden
            alternar sin perder nada.
          files: |
            salida/ControlDeHoras-Setup.exe
            dist/ControlDeHoras.exe
          fail_on_unmatched_files: true
